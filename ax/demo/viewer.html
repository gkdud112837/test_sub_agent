<style>

<script>
const ROWS=[{"file": "part_1", "voc_id": "r_001", "tag": "P1", "evidence": "결제 가능 표시라도", "note": "", "text": "현금 5천 원 들고 갔다가 1만 2천 원짜리 계란빵 앞에서 포기했습니다. 매대 앞에 결제 가능 표시라도 붙여 주세요.", "source": "블로그", "date": "2026-08-27"}, {"file": "part_1", "voc_id": "r_002", "tag": "해당없음", "evidence": "다들 만족", "note": "", "text": "아이 둘 데리고 다녀왔는데 다들 만족. 가격도 생각보다 괜찮았어요.", "source": "지도앱 리뷰", "date": "2026-06-10"}, {"file": "part_1", "voc_id": "r_003", "tag": "P1", "evidence": "현금만 받는다고", "note": "", "text": "양꼬치 매대는 현금만 받는다고 해서 결국 못 샀어요. 결제 방법만 미리 알았어도 됐을 텐데요.", "source": "지도앱 리뷰", "date": "2026-09-19"}, {"file": "part_1", "voc_id": "r_004", "tag": "해당없음", "evidence": "한 번은 들를 만합니다", "note": "", "text": "대구 오면 한 번은 들를 만합니다. 사진 찍기 좋은 곳도 많고요.", "source": "지도앱 리뷰", "date": "2026-08-09"}, {"file": "part_1", "voc_id": "r_005", "tag": "P2", "evidence": "현장은 임시 휴장", "note": "", "text": "SNS에는 연휴 정상 운영이라더니 현장은 임시 휴장. 택시비만 날렸습니다. 현장 가서야 아는 구조는 좀.", "source": "영상 댓글", "date": "2026-07-28"}, {"file": "part_1", "voc_id": "r_006", "tag": "해당없음", "evidence": "영상 잘 봤어요!", "note": "", "text": "영상 잘 봤어요! 다음엔 씨앗호떡 리뷰도 해 주세요.", "source": "영상 댓글", "date": "2026-10-16"}, {"file": "part_1", "voc_id": "r_007", "tag": "H2", "evidence": "출구 안내가 헷갈려서", "note": "", "text": "지하철역에서 출구 안내가 헷갈려서 반대쪽으로 나왔어요.", "source": "블로그", "date": "2026-10-24"}, {"file": "part_1", "voc_id": "r_008", "tag": "P1", "evidence": "단말기가 안 된다고", "note": "", "text": "망고 컵 사려고 10분 기다렸는데 단말기가 안 된다고 현금 달라고 하더라고요. 매대 앞에 결제 가능 표시라도 붙여 주세요.", "source": "블로그", "date": "2026-06-26"}, {"file": "part_1", "voc_id": "r_009", "tag": "H2", "evidence": "주차 자리 없어서", "note": "", "text": "주차 자리 없어서 멀리 대고 15분 걸어왔어요.", "source": "지도앱 리뷰", "date": "2026-08-08"}, {"file": "part_1", "voc_id": "r_010", "tag": "해당없음", "evidence": "여기 어디예요?", "note": "", "text": "여기 어디예요? 서문시장 맞나요?", "source": "영상 댓글", "date": "2026-08-23"}, {"file": "part_1", "voc_id": "r_011", "tag": "P3", "evidence": "번호표 같은 게 없으니", "note": "", "text": "번호표 같은 게 없으니 새치기 시비도 보이고… 줄이 제일 큰 문제.", "source": "블로그", "date": "2026-09-15"}, {"file": "part_1", "voc_id": "r_012", "tag": "해당없음", "evidence": "떡볶이 진짜 맛있어요.", "note": "", "text": "떡볶이 진짜 맛있어요. 납작만두 집 사장님도 친절하시고 또 갈 거예요.", "source": "블로그", "date": "2026-09-20"}, {"file": "part_1", "voc_id": "r_013", "tag": "P3", "evidence": "이미 다 팔렸대요", "note": "", "text": "8시 반에 갔더니 망고 컵 이미 다 팔렸대요. 몇 시쯤 품절되는지 알 수 있으면 좋겠어요. 다리 아파서 중간에 포기했습니다.", "source": "지도앱 리뷰", "date": "2026-07-01"}, {"file": "part_1", "voc_id": "r_014", "tag": "P1", "evidence": "결제 수단 안내가 하나도", "note": "", "text": "입구에 결제 수단 안내가 하나도 없어요. 어디가 카드 되는지 적어만 줘도 좋을 텐데. 다음엔 현금 넉넉히 들고 가야겠어요.", "source": "영상 댓글", "date": "2026-10-25"}, {"file": "part_1", "voc_id": "r_015", "tag": "P1", "evidence": "지갑을 세 번 꺼냈습니다", "note": "", "text": "페이 되는 곳, 카드 되는 곳, 현금만 되는 곳이 섞여 있어서 지갑을 세 번 꺼냈습니다. 이것만 해결되면 자주 갈 듯.", "source": "영상 댓글", "date": "2026-08-04"}, {"file": "part_1", "voc_id": "r_016", "tag": "P3", "evidence": "이미 다 팔렸대요", "note": "", "text": "8시 반에 갔더니 어묵 이미 다 팔렸대요. 몇 시쯤 품절되는지 알 수 있으면 좋겠어요. 실시간 대기줄만 알려 줘도 갈 만할 텐데.", "source": "지도앱 리뷰", "date": "2026-08-01"}, {"file": "part_1", "voc_id": "r_017", "tag": "해당없음", "evidence": "분위기 최고.", "note": "", "text": "분위기 최고. 불빛이랑 음악이랑 밤에 걷기 좋아요.", "source": "지도앱 리뷰", "date": "2026-06-06"}, {"file": "part_1", "voc_id": "r_018", "tag": "H2", "evidence": "주차 자리 없어서", "note": "", "text": "주차 자리 없어서 멀리 대고 15분 걸어왔어요.", "source": "지도앱 리뷰", "date": "2026-09-28"}, {"file": "part_1", "voc_id": "r_019", "tag": "P2", "evidence": "현장은 임시 휴장", "note": "", "text": "회사 사람들이랑 처음 가 봤어요. SNS에는 연휴 정상 운영이라더니 현장은 임시 휴장. 택시비만 날렸습니다.", "source": "블로그", "date": "2026-10-04"}, {"file": "part_1", "voc_id": "r_020", "tag": "P2", "evidence": "지도에 8시까지라고", "note": "", "text": "지도에 8시까지라고 써 있어서 7시 반에 갔는데 인기 메뉴는 이미 다 팔리고 매대도 접는 중이었어요.", "source": "블로그", "date": "2026-08-20"}, {"file": "part_1", "voc_id": "r_021", "tag": "해당없음", "evidence": "맛있네요. 추천.", "note": "", "text": "호떡 가게 새로 생겼던데 맛있네요. 추천.", "source": "영상 댓글", "date": "2026-06-08"}, {"file": "part_1", "voc_id": "r_022", "tag": "해당없음", "evidence": "가격이 작년보다 올랐네요", "note": "", "text": "오징어 튀김 가격이 작년보다 올랐네요. 그래도 맛은 그대로.", "source": "영상 댓글", "date": "2026-10-16"}, {"file": "part_1", "voc_id": "r_023", "tag": "H1", "evidence": "자리 찾아 10분 헤맸어요", "note": "", "text": "큐브 스테이크 들고 자리 찾아 10분 헤맸어요.", "source": "블로그", "date": "2026-10-12"}, {"file": "part_1", "voc_id": "r_024", "tag": "해당없음", "evidence": "고르는 재미가 있어요", "note": "", "text": "여자친구랑 처음 가 봤어요. 외국인 친구가 제일 좋아했던 곳. 음식 종류가 다양해서 고르는 재미가 있어요.", "source": "영상 댓글", "date": "2026-10-20"}, {"file": "part_1", "voc_id": "r_025", "tag": "해당없음", "evidence": "고르는 재미가 있어요", "note": "", "text": "외국인 친구가 제일 좋아했던 곳. 음식 종류가 다양해서 고르는 재미가 있어요.", "source": "블로그", "date": "2026-10-21"}, {"file": "part_1", "voc_id": "r_026", "tag": "P3", "evidence": "어디가 줄이 길고", "note": "", "text": "어디가 줄이 길고 어디가 바로 되는지 한눈에 보이면 동선이 훨씬 편할 거예요.", "source": "지도앱 리뷰", "date": "2026-08-11"}, {"file": "part_1", "voc_id": "r_027", "tag": "해당없음", "evidence": "다들 만족", "note": "", "text": "여자친구랑 다녀왔는데 다들 만족. 가격도 생각보다 괜찮았어요.", "source": "블로그", "date": "2026-08-12"}, {"file": "part_1", "voc_id": "r_028", "tag": "P1", "evidence": "계좌이체만 된다고 해서", "note": "", "text": "카드 되는 줄 알고 줄 섰는데 계좌이체만 된다고 해서 다시 뒤로 갔습니다. 이것만 해결되면 자주 갈 듯.", "source": "영상 댓글", "date": "2026-10-11"}, {"file": "part_1", "voc_id": "r_029", "tag": "해당없음", "evidence": "가격이 작년보다 올랐네요", "note": "", "text": "수제 소시지 가격이 작년보다 올랐네요. 그래도 맛은 그대로.", "source": "영상 댓글", "date": "2026-10-23"}, {"file": "part_1", "voc_id": "r_030", "tag": "P1", "evidence": "카드 된다고 써 있어서", "note": "", "text": "지도 앱 리뷰에 카드 된다고 써 있어서 믿고 갔는데 그 매대는 아니었어요. 이것만 해결되면 자주 갈 듯.", "source": "블로그", "date": "2026-08-07"}, {"file": "part_1", "voc_id": "r_031", "tag": "P3", "evidence": "대기 안내는 없고", "note": "", "text": "떡볶이 매대 앞에 사람이 너무 몰려서 통행도 안 되고 대기 안내는 없고. 실시간 대기줄만 알려 줘도 갈 만할 텐데.", "source": "영상 댓글", "date": "2026-06-03"}, {"file": "part_1", "voc_id": "r_032", "tag": "P2", "evidence": "현장은 임시 휴장", "note": "", "text": "SNS에는 연휴 정상 운영이라더니 현장은 임시 휴장. 택 혀 있었어요. 동행한 외국인 친구한테 설명하기도 민망했음.", "source": "영상 댓글", "date": "2026-09-13"}, {"file": "part_1", "voc_id": "r_074", "tag": "P3", "evidence": "어디가 줄이 길고", "note": "", "text": "두 번째 방문이에요. 어디가 줄이 길고 어디가 바로 되는지 한눈에 보이면 동선이 훨씬 편할 거예요.", "source": "지도앱 리뷰", "date": "2026-09-23"}, {"file": "part_1", "voc_id": "r_075", "tag": "P1", "evidence": "현금만 받는다고", "note": "", "text": "양꼬치 매대는 현금만 받는다고 해서 결국 못 샀어요. 현금인출기도 멀어서 왕복 15분.", "source": "지도앱 리뷰", "date": "2026-10-13"}, {"file": "part_1", "voc_id": "r_076", "tag": "검토", "evidence": "현금 5천 원 들고 갔다가", "note": "현금 부족으로 포기했으나 카드 불가 등 결제 수단 문제인지 원문에 명시되지 않음", "text": "현금 5천 원 들고 갔다가 1만 2천 원짜리 오징어 튀김 앞에서 포기했습니다. 다음엔 현금 넉넉히 들고 가야겠어요.", "source": "블로그", "date": "2026-09-11"}, {"file": "part_1", "voc_id": "r_077", "tag": "P1", "evidence": "단말기가 안 된다고", "note": "", "text": "닭강정 사려고 10분 기다렸는데 단말기가 안 된다고 현금 달라고 하더라고요. 다음엔 현금 넉넉히 들고 가야겠어요.", "source": "지도앱 리뷰", "date": "2026-10-08"}, {"file": "part_1", "voc_id": "r_078", "tag": "H1", "evidence": "앉을 공간이 없어서", "note": "", "text": "노약자 모시고 가기엔 앉을 공간이 없어서 힘들었습니다.", "source": "지도앱 리뷰", "date": "2026-10-17"}, {"file": "part_1", "voc_id": "r_079", "tag": "해당없음", "evidence": "양념이 좀 짰어요", "note": "", "text": "다 좋았는데 양념이 좀 짰어요. 개인 취향일 수 있음.", "source": "블로그", "date": "2026-09-21"}, {"file": "part_1", "voc_id": "r_080", "tag": "P3", "evidence": "두 번째 방문인데 또 품절", "note": "", "text": "두 번째 방문인데 또 품절. 재고 소진 시간을 어디에도 안 알려 줘요. 인기 메뉴는 예약이라도 받아 주세요.", "source": "지도앱 리뷰", "date": "2026-10-22"}, {"file": "part_1", "voc_id": "r_081", "tag": "P1", "evidence": "지갑을 세 번 꺼냈습니다", "note": "", "text": "페이 되는 곳, 카드 되는 곳, 현금만 되는 곳이 섞여 있어서 지갑을 세 번 꺼냈습니다. 다음엔 현금 넉넉히 들고 가야겠어요.", "source": "영상 댓글", "date": "2026-07-04"}, {"file": "part_1", "voc_id": "r_082", "tag": "P2", "evidence": "매대 운영 요일이 가게마다", "note": "", "text": "개장 직후 친구랑 다녀왔습니다. 매대 운영 요일이 가게마다 달라서 먹고 싶던 큐브 스테이크 집은 그날 안 나왔어요.", "source": "지도앱 리뷰", "date": "2026-10-01"}, {"file": "part_1", "voc_id": "r_083", "tag": "해당없음", "evidence": "매대가 많이 바뀌었네요", "note": "", "text": "오랜만에 왔는데 매대가 많이 바뀌었네요.", "source": "영상 댓글", "date": "2026-06-12"}, {"file": "part_1", "voc_id": "r_084", "tag": "P3", "evidence": "줄이 한 시간", "note": "", "text": "유튜브에 나온 집은 줄이 한 시간. 옆 매대는 한산한데 정보가 없으니 다들 한 곳에. 결국 편의점 가서 때움.", "source": "영상 댓글", "date": "2026-10-14"}, {"file": "part_1", "voc_id": "r_085", "tag": "P3", "evidence": "대기 시간이라도 알면", "note": "", "text": "아이들이랑 줄 서는 게 제일 힘들었어요. 대기 시간이라도 알면 돌아다니다 올 텐데. 실시간 대기줄만 알려 줘도 갈 만할 텐데.", "source": "영상 댓글", "date": "2026-08-23"}, {"file": "part_1", "voc_id": "r_086", "tag": "해당없음", "evidence": "맛있네요. 추천.", "note": "", "text": "떡볶이 매대 새로 생겼던데 맛있네요. 추천.", "source": "블로그", "date": "2026-10-17"}, {"file": "part_1", "voc_id": "r_087", "tag": "P2", "evidence": "정보마다 개장 시간이", "note": "", "text": "두 번째 방문이에요. 정보마다 개장 시간이 6시, 7시, 7시 반으로 제각각. 결국 7시에 도착해 30분 멍하니 기다림. 현장 가서야 아는 구조는 좀.", "source": "지도앱 리뷰", "date": "2026-10-26"}, {"file": "part_1", "voc_id": "r_088", "tag": "P1", "evidence": "결제 방법이 달라서", "note": "", "text": "매대마다 결제 방법이 달라서 어디서 뭘 쓸 수 있는지 미리 알 수가 없네요. 이것만 해결되면 자주 갈 듯.", "source": "블로그", "date": "2026-08-19"}, {"file": "part_1", "voc_id": "r_089", "tag": "P3", "evidence": "번호표 같은 게 없으니", "note": "", "text": "번호표 같은 게 없으니 새치기 시비도 보이고… 줄이 제일 큰 문제.", "source": "블로그", "date": "2026-10-26"}, {"file": "part_1", "voc_id": "r_090", "tag": "P3", "evidence": "실시간 대기줄만 알려 줘도", "note": "", "text": "어묵는 포기하고 바로 되는 떡볶이 먹었어요. 먹고 싶은 건 결국 못 먹음. 실시간 대기줄만 알려 줘도 갈 만할 텐데.", "source": "영상 댓글", "date": "2026-10-05"}, {"file": "part_1", "voc_id": "r_091", "tag": "해당없음", "evidence": "바삭하고 양도 많아요.", "note": "", "text": "계란빵는 꼭 드세요. 바삭하고 양도 많아요.", "source": "지도앱 리뷰", "date": "2026-09-20"}, {"file": "part_1", "voc_id": "r_092", "tag": "P1", "evidence": "현금 없이 갔다가", "note": "", "text": "현금 없이 갔다가 닭강정 못 먹고 왔어요. 사전에 알았으면 뽑아갔을 거예요.", "source": "지도앱 리뷰", "date": "2026-07-05"}, {"file": "part_1", "voc_id": "r_093", "tag": "해당없음", "evidence": "바삭하고 양도 많아요.", "note": "", "text": "씨앗호떡는 꼭 드세요. 바삭하고 양도 많아요.", "source": "지도앱 리뷰", "date": "2026-06-04"}, {"file": "part_1", "voc_id": "r_094", "tag": "해당없음", "evidence": "고르는 재미가 있어요", "note": "", "text": "외국인 친구가 제일 좋아했던 곳. 음식 종류가 다양해서 고르는 재미가 있어요.", "source": "지도앱 리뷰", "date": "2026-10-25"}, {"file": "part_1", "voc_id": "r_095", "tag": "P3", "evidence": "대기 안내는 없고", "note": "", "text": "두 번째 방문이에요. 과일 컵 매대 앞에 사람이 너무 몰려서 통행도 안 되고 대기 안내는 없고. 결국 편의점 가서 때움.", "source": "블로그", "date": "2026-08-14"}, {"file": "part_1", "voc_id": "r_096", "tag": "P3", "evidence": "번호표 같은 게 없으니", "note": "", "text": "번호표 같은 게 없으니 새치기 시비도 보이고… 줄이 제일 큰 문제. 인기 메뉴는 예약이라도 받아 주세요.", "source": "블로그", "date": "2026-09-23"}, {"file": "part_1", "voc_id": "r_097", "tag": "P2", "evidence": "매대 운영 요일이 가게마다", "note": "", "text": "매대 운영 요일이 가게마다 달라서 먹고 싶던 닭강정 집은 그날 안 나왔어요.", "source": "지도앱 리뷰", "date": "2026-09-14"}, {"file": "part_1", "voc_id": "r_098", "tag": "해당없음", "evidence": "가격이 작년보다 올랐네요", "note": "", "text": "닭강정 가격이 작년보다 올랐네요. 그래도 맛은 그대로.", "source": "블로그", "date": "2026-07-11"}, {"file": "part_1", "voc_id": "r_099", "tag": "H2", "evidence": "주차 자리 없어서", "note": "", "text": "주차 자리 없어서 멀리 대고 15분 걸어왔어요.", "source": "영상 댓글", "date": "2026-10-24"}, {"file": "part_1", "voc_id": "r_100", "tag": "P1", "evidence": "현금만 받는다고", "note": "", "text": "혼자 처음 가 봤어요. 계란빵 매대는 현금만 받는다고 해서 결국 못 샀어요.", "source": "영상 댓글", "date": "2026-07-07"}, {"file": "part_2", "voc_id": "r_101", "tag": "P1", "evidence": "계좌이체만 된다고", "note": "", "text": "카드 되는 줄 알고 줄 섰는데 계좌이체만 된다고 해서 다시 뒤로 갔습니다.", "source": "블로그", "date": "2026-07-26"}, {"file": "part_2", "voc_id": "r_102", "tag": "해당없음", "evidence": "납작만두는 꼭 드세요", "note": "", "text": "납작만두는 꼭 드세요. 바삭하고 양도 많아요.", "source": "지도앱 리뷰", "date": "2026-06-15"}, {"file": "part_2", "voc_id": "r_103", "tag": "해당없음", "evidence": "수제 소시지 리뷰도", "note": "", "text": "영상 잘 봤어요! 다음엔 수제 소시지 리뷰도 해 주세요.", "source": "영상 댓글", "date": "2026-10-11"}, {"file": "part_2", "voc_id": "r_104", "tag": "H1", "evidence": "테이블이 몇 개 없어서", "note": "", "text": "테이블이 몇 개 없어서 동생이랑 갔는데 계단에 앉아 먹었습니다.", "source": 어왔어요.", "source": "지도앱 리뷰", "date": "2026-10-07"}, {"file": "part_3", "voc_id": "r_291", "tag": "해당없음", "evidence": "양념이 좀 짰어요", "note": "", "text": "다 좋았는데 양념이 좀 짰어요. 개인 취향일 수 있음.", "source": "블로그", "date": "2026-07-22"}, {"file": "part_3", "voc_id": "r_292", "tag": "P1", "evidence": "카드 안 되니까", "note": "", "text": "닭강정 매대 줄이 유독 느린 이유가 결제 때문이더라고요. 카드 안 되니까 다들 현금 찾느라. 다음엔 현금 넉넉히 들고 가야겠어요.", "source": "블로그", "date": "2026-09-20"}, {"file": "part_3", "voc_id": "r_293", "tag": "P3", "evidence": "얼마나 기다릴지", "note": "", "text": "부모님 모시고 처음 가 봤어요. 인기 매대는 줄이 어디가 끝인지도 모르겠고, 얼마나 기다릴지 아무도 몰라요. 실시간 대기줄만 알려 줘도 갈 만할 텐데.", "source": "블로그", "date": "2026-07-28"}, {"file": "part_3", "voc_id": "r_294", "tag": "P2", "evidence": "현장은 임시 휴장", "note": "", "text": "SNS에는 연휴 정상 운영이라더니 현장은 임시 휴장. 택시비만 날렸습니다.", "source": "영상 댓글", "date": "2026-10-01"}, {"file": "part_3", "voc_id": "r_295", "tag": "해당없음", "evidence": "분위기 최고", "note": "", "text": "분위기 최고. 불빛이랑 음악이랑 밤에 걷기 좋아요.", "source": "영상 댓글", "date": "2026-10-26"}, {"file": "part_3", "voc_id": "r_296", "tag": "해당없음", "evidence": "계좌번호를 큰 소리로", "note": "", "text": "계좌이체 하려는데 상인분 계좌번호를 큰 소리로 불러 주셔서 뒤에서 다 듣고… 결제 자체가 불편합니다.", "source": "블로그", "date": "2026-10-20"}, {"file": "part_3", "voc_id": "r_297", "tag": "H1", "evidence": "먹을 자리가 너무 없어요", "note": "", "text": "먹을 자리가 너무 없어요. 서서 먹다가 소스 다 흘림.", "source": "영상 댓글", "date": "2026-06-16"}, {"file": "part_3", "voc_id": "r_298", "tag": "해당없음", "evidence": "들를 만합니다", "note": "", "text": "친구랑 처음 가 봤어요. 대구 오면 한 번은 들를 만합니다. 사진 찍기 좋은 곳도 많고요.", "source": "지도앱 리뷰", "date": "2026-08-02"}, {"file": "part_3", "voc_id": "r_299", "tag": "해당없음", "evidence": "바삭하고 양도 많아요", "note": "", "text": "수제 소시지는 꼭 드세요. 바삭하고 양도 많아요.", "source": "지도앱 리뷰", "date": "2026-08-21"}, {"file": "part_3", "voc_id": "r_300", "tag": "검토", "evidence": "계란빵 앞에서 포기했습니다", "note": "현금 부족으로 포기했으나 카드 불가 등 결제 수단 문제인지 원문에 명시 없음", "text": "현금 5천 원 들고 갔다가 1만 2천 원짜리 계란빵 앞에서 포기했습니다. 이것만 해결되면 자주 갈 듯.", "source": "영상 댓글", "date": "2026-06-27"}, {"file": "test", "voc_id": "r_001", "tag": "P1", "evidence": "결제 가능 표시라도", "note": "", "text": "현금 5천 원 들고 갔다가 1만 2천 원짜리 계란빵 앞에서 포기했습니다. 매대 앞에 결제 가능 표시라도 붙여 주세요.", "source": "블로그", "date": "2026-08-27"}, {"file": "test", "voc_id": "r_002", "tag": "해당없음", "evidence": "다들 만족", "note": "", "text": "아이 둘 데리고 다녀왔는데 다들 만족. 가격도 생각보다 괜찮았어요.", "source": "지도앱 리뷰", "date": "2026-06-10"}, {"file": "test", "voc_id": "r_003", "tag": "P1", "evidence": "현금만 받는다고 해서", "note": "", "text": "양꼬치 매대는 현금만 받는다고 해서 결국 못 샀어요. 결제 방법만 미리 알았어도 됐을 텐데요.", "source": "지도앱 리뷰", "date": "2026-09-19"}, {"file": "test", "voc_id": "r_004", "tag": "해당없음", "evidence": "들를 만합니다", "note": "", "text": "대구 오면 한 번은 들를 만합니다. 사진 찍기 좋은 곳도 많고요.", "source": "지도앱 리뷰", "date": "2026-08-09"}, {"file": "test", "voc_id": "r_005", "tag": "P2", "evidence": "현장은 임시 휴장", "note": "", "text": "SNS에는 연휴 정상 운영이라더니 현장은 임시 휴장. 택시비만 날렸습니다. 현장 가서야 아는 구조는 좀.", "source": "영상 댓글", "date": "2026-07-28"}, {"file": "test", "voc_id": "r_006", "tag": "해당없음", "evidence": "영상 잘 봤어요!", "note": "", "text": "영상 잘 봤어요! 다음엔 씨앗호떡 리뷰도 해 주세요.", "source": "영상 댓글", "date": "2026-10-16"}, {"file": "test", "voc_id": "r_007", "tag": "H2", "evidence": "출구 안내가 헷갈려서", "note": "", "text": "지하철역에서 출구 안내가 헷갈려서 반대쪽으로 나왔어요.", "source": "블로그", "date": "2026-10-24"}, {"file": "test", "voc_id": "r_008", "tag": "P1", "evidence": "단말기가 안 된다고", "note": "", "text": "망고 컵 사려고 10분 기다렸는데 단말기가 안 된다고 현금 달라고 하더라고요. 매대 앞에 결제 가능 표시라도 붙여 주세요.", "source": "블로그", "date": "2026-06-26"}, {"file": "test", "voc_id": "r_009", "tag": "H2", "evidence": "주차 자리 없어서", "note": "", "text": "주차 자리 없어서 멀리 대고 15분 걸어왔어요.", "source": "지도앱 리뷰", "date": "2026-08-08"}, {"file": "test", "voc_id": "r_010", "tag": "해당없음", "evidence": "여기 어디예요?", "note": "", "text": "여기 어디예요? 서문시장 맞나요?", "source": "영상 댓글", "date": "2026-08-23"}];
const TAGS=["P1","P2","P3","H1","H2","해당없음","검토"];
const COLOR={P1:"var(--P1)",P2:"var(--P2)",P3:"var(--P3)",H1:"var(--H1)",H2:"var(--H2)","해당없음":"var(--none)","검토":"var(--rev)"};
const files=[...new Set(ROWS.map(r=>r.file))];let fSel="전체",tSel=new Set(),q="";
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function chips(){const fe=document.getElementById("files");fe.innerHTML="";["전체",...files].forEach(f=>{const b=document.createElement("button");b.textContent=f;b.className=f===fSel?"on":"";b.onclick=()=>{fSel=f;chips();draw()};fe.appendChild(b)});
const te=document.getElementById("tags");te.innerHTML="";TAGS.forEach(t=>{const b=document.createElement("button");b.textContent=t;b.className=tSel.has(t)?"on":"";b.onclick=()=>{tSel.has(t)?tSel.delete(t):tSel.add(t);chips();draw()};te.appendChild(b)})}
function draw(){const rs=ROWS.filter(r=>(fSel==="전체"||r.file===fSel)&&(!tSel.size||tSel.has(r.tag))&&(!q||(r.voc_id+r.text+r.evidence+r.note).includes(q)));
const cnt={};rs.forEach(r=>cnt[r.tag]=(cnt[r.tag]||0)+1);
document.getElementById("stat").textContent=rs.length+"건 · "+TAGS.filter(t=>cnt[t]).map(t=>t+" "+cnt[t]).join(" · ");
document.getElementById("tb").innerHTML=rs.map(r=>{let t=esc(r.text);const ev=esc(r.evidence);if(ev&&t.includes(ev))t=t.replace(ev,"<mark>"+ev+"</mark>");
return `<tr><td class="id">${esc(r.voc_id)}</td><td class="meta">${esc(r.file)}</td><td><span class="tag" style="background:${COLOR[r.tag]||"#000"}">${esc(r.tag)}</span></td><td>${t||"<i>원문 없음</i>"}</td><td><div class="ev">${ev}</div>${r.note?`<div class="note">${esc(r.note)}</div>`:""}</td><td class="meta">${esc(r.source)}<br>${esc(r.date)}</td></tr>`}).join("")}
document.getElementById("q").oninput=e=>{q=e.target.value.trim();draw()};chips();draw();
</script></body></html>
