<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060F">
<title>오늘의 매대판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Brush+Script&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* 디자인 시스템: design/design-system.md v2 "포차 골목의 밤"
     레이아웃: 프레임 없는 모바일 한 줄 흐름(최대 480px, 넓은 화면은 가운데 정렬).
     줄조명 + 네온 간판(운영 상태) → 칠판(현금 없이) → 천막 차양 아래 포차 목록. 의도적으로 어두운 단일 테마. */
  :root {
    --sky-0: #07060F;
    --surface: #1A1325; --surface-2: #241A31; --line: #3B2D4A;
    --ink: #FFF3E2; --ink-2: #DCCAB6; --ink-3: #A592A9;
    --bulb: #FFD27A; --bulb-hot: #FFF2CC; --glow: rgba(255, 184, 77, .55);
    --tarp-r: #D8382A; --tarp-o: #F2842B; --tarp-w: #F4E3C8;
    --mint: #4FF0B6; --mint-bg: rgba(79, 240, 182, .13);
    --pink: #FF5E7C; --pink-bg: rgba(255, 94, 124, .14);
    --off: #6E6280; --focus: #FFD27A; --scrim: rgba(4, 3, 10, .66);
    --chalk: #15241F; --wood: #5A3B22; --chalk-ink: #F3F0E4; --chalk-ink-2: #B9C9C0;
    --on-bulb: #2A1A08;
    --f-neon: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --f-brush: "Nanum Brush Script", "Noto Sans KR", "Malgun Gothic", cursive;
    --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    --r-s: 8px; --r-m: 14px; --r-l: 20px;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    color: var(--ink); font: 400 15px/1.55 var(--f-body); word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(120% 60% at 50% -12%, #2B1A4F 0%, transparent 62%),
      radial-gradient(90% 40% at 50% 112%, #3A170F 0%, transparent 70%),
      var(--sky-0);
    background-attachment: fixed;
  }
  /* 멀리 번지는 불빛 (보케) */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(3px 3px at 12% 18%, var(--bulb) 50%, transparent 100%),
      radial-gradient(2px 2px at 82% 12%, var(--bulb-hot) 50%, transparent 100%),
      radial-gradient(4px 4px at 68% 34%, rgba(255, 94, 124, .8) 50%, transparent 100%),
      radial-gradient(3px 3px at 24% 52%, rgba(79, 240, 182, .6) 50%, transparent 100%),
      radial-gradient(2px 2px at 90% 64%, var(--bulb) 50%, transparent 100%),
      radial-gradient(3px 3px at 6% 80%, var(--tarp-o) 50%, transparent 100%),
      radial-gradient(2px 2px at 48% 90%, var(--bulb-hot) 50%, transparent 100%),
      radial-gradient(40px 40px at 92% 28%, rgba(255, 150, 60, .10), transparent 70%),
      radial-gradient(60px 60px at 8% 40%, rgba(255, 94, 124, .08), transparent 70%),
      radial-gradient(50px 50px at 80% 86%, rgba(255, 210, 122, .08), transparent 70%);
    animation: twinkle 5s ease-in-out infinite alternate;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: var(--r-s); }
  .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: 0; }

  .app {
    position: relative; z-index: 1; max-width: 480px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: 16px;
  }
  .app > * { min-width: 0; }

  /* ---------- 줄조명 ---------- */
  .lights { display: block; width: 100%; height: 56px; margin-bottom: -8px; overflow: visible; }
  .lights .wire { fill: none; stroke: #4A3A55; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .lights .bulb { animation: twinkle 2.4s ease-in-out infinite alternate; }
  @keyframes twinkle { 0% { opacity: .45; } 100% { opacity: 1; } }

  /* ---------- 상단 · 네온 간판 ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .place { margin: 0; font-size: 12px; letter-spacing: .14em; color: var(--ink-3); }
  .neon {
    margin: 10px 0 0; font-family: var(--f-neon); font-weight: 400; font-size: clamp(36px, 12vw, 48px); line-height: 1.05; color: #FFE9C4; white-space: nowrap;
    text-shadow: 0 0 2px #FFF6E0, 0 0 10px var(--tarp-o), 0 0 24px var(--tarp-r), 0 0 46px rgba(216, 56, 42, .7);
    animation: flicker 7s linear infinite;
  }
  @keyframes flicker { 0%, 18%, 22%, 62%, 64%, 100% { opacity: 1; } 20%, 63% { opacity: .6; } }
  .mode { flex: none; display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); }
  .mode button { min-height: 36px; padding: 0 10px; border-radius: 9px; font-size: 13px; color: var(--ink-3); }
  .mode button[aria-pressed="true"] { background: var(--bulb); color: var(--on-bulb); font-weight: 700; box-shadow: 0 0 14px var(--glow); }

  /* 운영 상태 — 불 켜진 간판 */
  .board { border-radius: var(--r-l); padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 14px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .02)), var(--surface);
    border: 1px solid var(--line); box-shadow: 0 20px 40px -24px rgba(0, 0, 0, .8); }
  .board-head { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
  .board-head .when { display: flex; }
  .sign { --c: var(--mint); flex: none; font-family: var(--f-neon); font-size: 24px; line-height: 1; padding: 10px 12px 9px; border-radius: 12px;
    color: var(--c); border: 2px solid var(--c); text-shadow: 0 0 8px var(--c), 0 0 18px var(--c);
    box-shadow: 0 0 12px color-mix(in srgb, var(--c) 60%, transparent), inset 0 0 12px color-mix(in srgb, var(--c) 35%, transparent); }
  .sign.soon { --c: var(--bulb); }
  .sign.off { --c: var(--pink); animation: dying 4s linear infinite; }
  @keyframes dying { 0%, 40%, 44%, 100% { opacity: .8; } 42% { opacity: .3; } }
  .when { font-size: 13px; color: var(--ink-3); }
  .say { margin: 2px 0 0; white-space: pre-line; font-size: 16px; font-weight: 500; line-height: 1.5; text-wrap: balance; }
  .track { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .08); overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--tarp-o), var(--bulb)); box-shadow: 0 0 10px var(--glow); }
  .ticks { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); margin-top: 6px; }
  .src { font-size: 12px; color: var(--ink-3); border-top: 1px dashed var(--line); padding-top: 12px; }

  /* ---------- 칠판 (현금 없이) ---------- */
  .chalk { border-radius: var(--r-l); background: var(--chalk); border: 6px solid var(--wood);
    box-shadow: inset 0 0 40px rgba(0, 0, 0, .45), 0 16px 30px -20px rgba(0, 0, 0, .9); }
  .chalk-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 72px; padding: 12px 14px 12px 18px; }
  .chalk-row .t { flex: 1; min-width: 0; }
  .chalk-row b { display: block; font-family: var(--f-brush); font-weight: 400; font-size: 30px; line-height: 1.1; color: var(--chalk-ink); }
  .chalk-row .d { display: block; font-size: 13px; color: var(--chalk-ink-2); }
  .sw { flex: none; width: 54px; height: 32px; border-radius: 16px; background: rgba(255, 255, 255, .14); position: relative; transition: background .2s, box-shadow .2s; }
  .sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--chalk-ink); transition: transform .2s; }
  .chalk-row[aria-pressed="true"] .sw { background: var(--mint); box-shadow: 0 0 14px var(--mint); }
  .chalk-row[aria-pressed="true"] .sw::after { transform: translateX(22px); background: var(--chalk); }

  /* ---------- 필터 ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { min-height: 36px; padding: 0 14px; border-radius: 999px; font-size: 13px; color: var(--ink-2); border: 1px solid var(--line); background: rgba(255, 255, 255, .04); }
  .chips button[aria-pressed="true"] { background: var(--bulb); border-color: var(--bulb); color: var(--on-bulb); font-weight: 700; box-shadow: 0 0 16px var(--glow); }

  /* ---------- 천막 차양 + 포차 골목 ---------- */
  .alley { border-radius: var(--r-l); overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
  .awning {
    height: 46px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .12), rgba(0, 0, 0, .28)), repeating-linear-gradient(90deg, var(--tarp-r) 0 26px, var(--tarp-w) 26px 52px);
    -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - 13px) no-repeat, radial-gradient(circle at 13px 0, #000 12.5px, transparent 13px) bottom / 26px 13px repeat-x;
            mask: linear-gradient(#000 0 0) top / 100% calc(100% - 13px) no-repeat, radial-gradient(circle at 13px 0, #000 12.5px, transparent 13px) bottom / 26px 13px repeat-x;
  }
  .alley-in { background: radial-gradient(90% 120px at 50% 0, rgba(255, 170, 80, .22), transparent 100%); padding: 6px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
  .alley-head { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 6px 2px; }
  .alley-head h2 { margin: 0; font-family: var(--f-brush); font-weight: 400; font-size: 34px; line-height: 1; color: var(--bulb-hot); text-shadow: 0 0 14px var(--glow); }
  .alley-head span { font-size: 12px; color: var(--ink-3); }
  .stalls { display: flex; flex-direction: column; gap: 10px; }

  .stall { position: relative; display: grid; grid-template-columns: 50px 1fr; gap: 6px 14px; width: 100%; padding: 20px 14px 14px; border-radius: 16px; overflow: hidden;
    background: linear-gradient(180deg, rgba(255, 170, 80, .10), rgba(255, 170, 80, 0) 60%), var(--surface-2); border: 1px solid rgba(255, 190, 110, .16); transition: transform .12s; }
  .stall::before { /* 포차 미니 차양 */
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 12px;
    background: repeating-linear-gradient(90deg, var(--tarp-o) 0 14px, var(--tarp-w) 14px 28px);
    -webkit-mask: linear-gradient(#000 0 0) top / 100% 5px no-repeat, radial-gradient(circle at 7px 0, #000 6.5px, transparent 7px) 0 5px / 14px 7px repeat-x;
            mask: linear-gradient(#000 0 0) top / 100% 5px no-repeat, radial-gradient(circle at 7px 0, #000 6.5px, transparent 7px) 0 5px / 14px 7px repeat-x;
  }
  .stall:active { transform: scale(.985); }
  .stall.dark { background: var(--surface-2); border-color: var(--line); }
  .stall.dark::before { background: repeating-linear-gradient(90deg, #4B3F57 0 14px, #2F2638 14px 28px); }
  .stall.dark .name { color: var(--ink-3); }

  /* 홍등 번호 */
  .lantern { grid-row: span 3; align-self: start; position: relative; flex: none; width: 46px; height: 52px; margin: 4px 2px 0; display: grid; place-items: center;
    border-radius: 46% 46% 42% 42% / 50%; font-family: var(--f-neon); font-size: 19px; color: var(--ink);
    background: radial-gradient(circle at 50% 38%, #FF9A63 0%, var(--tarp-r) 55%, #7E1A14 100%);
    box-shadow: 0 0 18px rgba(255, 90, 50, .6), inset 0 -6px 10px rgba(0, 0, 0, .3); animation: breathe 3.2s ease-in-out infinite alternate; }
  .lantern::before, .lantern::after { content: ""; position: absolute; left: 50%; transform: translateX(-50%); background: #2B1B12; border-radius: 2px; }
  .lantern::before { top: -4px; width: 22px; height: 6px; }
  .lantern::after { bottom: -4px; width: 18px; height: 5px; }
  .stall.dark .lantern, .lantern.unlit { background: radial-gradient(circle at 50% 38%, #4A3F55, #2C2436 70%); color: var(--ink-3); box-shadow: none; animation: none; }
  @keyframes breathe { 0% { box-shadow: 0 0 12px rgba(255, 90, 50, .45), inset 0 -6px 10px rgba(0, 0, 0, .3); } 100% { box-shadow: 0 0 24px rgba(255, 110, 60, .8), inset 0 -6px 10px rgba(0, 0, 0, .3); } }

  .name-line { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .name { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .st.open { color: var(--mint); } .st.closed, .st.early { color: var(--pink); }
  .st.unknown, .st.off { color: var(--ink-3); }
  .st.unknown::before, .st.off::before { box-shadow: none; }
  .st.unknown::before { background: transparent; border: 1.5px solid var(--off); }
  .line2 { font-size: 13px; color: var(--ink-3); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line2 .so { color: var(--pink); font-weight: 500; }
  .old { font-size: 11px; font-weight: 700; color: var(--bulb); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; margin-left: 6px; }

  /* 결제 칸 — 현금 · 카드 · 이체 · 페이 고정 순서 */
  .pays { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
  .pay { display: flex; align-items: center; justify-content: center; gap: 3px; height: 28px; border-radius: var(--r-s); font-size: 12px; font-weight: 500; border: 1px solid transparent; }
  .pay.yes { color: var(--mint); background: var(--mint-bg); border-color: rgba(79, 240, 182, .55); font-weight: 700; text-shadow: 0 0 8px rgba(79, 240, 182, .6); box-shadow: 0 0 10px rgba(79, 240, 182, .18); }
  .pay.no { color: var(--off); text-decoration: line-through; }
  .pay.unk { color: var(--ink-3); border: 1px dashed var(--off); }
  .pay.muted { opacity: .3; }
  .empty { padding: 28px 12px; text-align: center; color: var(--ink-3); }

  .foot { font-size: 12px; line-height: 1.75; color: var(--ink-3); padding: 0 4px; }
  .foot b { display: block; font-family: var(--f-brush); font-weight: 400; font-size: 24px; color: var(--ink-2); margin-bottom: 2px; }

  /* ---------- 시트 ---------- */
  .scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .22s; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; z-index: 21; left: 50%; bottom: 0; width: 100%; max-width: 480px; max-height: 88%; overflow-y: auto; overscroll-behavior: contain;
    background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: 0 -20px 50px -20px rgba(255, 140, 60, .35);
    padding: 0 max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
    transform: translate(-50%, 104%); transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
  .sheet.show { transform: translate(-50%, 0); }
  .sheet > .awning { height: 34px; margin: 0 -20px 16px; }
  .s-head { display: flex; align-items: center; gap: 14px; }
  .s-head .lantern { width: 54px; height: 60px; font-size: 22px; margin: 4px 0 0; }
  .s-head h3 { margin: 0; font-size: 22px; line-height: 1.3; font-weight: 700; }
  .s-label { margin: 22px 0 8px; font-size: 13px; font-weight: 700; color: var(--ink-3); }
  .paybig { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .paybig .pay { height: 52px; font-size: 15px; border-radius: var(--r-m); justify-content: space-between; padding: 0 16px; }
  .paybig .pay.no { background: rgba(255, 255, 255, .03); }
  .menu { display: flex; flex-direction: column; }
  .menu div { display: flex; align-items: center; justify-content: space-between; min-height: 44px; border-bottom: 1px dashed var(--line); font-size: 15px; }
  .menu div:last-child { border-bottom: 0; }
  .menu .x { color: var(--off); text-decoration: line-through; }
  .tag { font-size: 12px; font-weight: 700; color: var(--pink); background: var(--pink-bg); border: 1px solid rgba(255, 94, 124, .5); padding: 2px 8px; border-radius: 6px; }
  .src-tag { margin-top: 18px; padding: 12px 14px; border-radius: var(--r-m); background: var(--surface-2); font-size: 12px; color: var(--ink-2); }
  .src-tag b { color: var(--bulb); }
  .btns { display: flex; gap: 8px; margin-top: 16px; }
  .btn { flex: 1; height: 52px; border-radius: var(--r-m); font-size: 16px; font-weight: 700; text-align: center; }
  .btn.main { background: var(--bulb); color: var(--on-bulb); box-shadow: 0 0 18px var(--glow); }
  .btn.main:disabled { background: var(--surface-2); color: var(--ink-3); box-shadow: none; cursor: default; }
  .btn.sub { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
  .s-title { margin: 0 0 4px; font-size: 22px; font-weight: 700; line-height: 1.35; }
  .s-desc { margin: 0 0 8px; font-size: 13px; color: var(--ink-3); }
  .opt { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 52px; font-size: 16px; border-bottom: 1px dashed var(--line); }
  .opt:last-child { border-bottom: 0; }
  .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--off); display: grid; place-items: center; }
  .opt[aria-checked="true"] .radio { border-color: var(--bulb); background: var(--bulb); box-shadow: 0 0 10px var(--glow); }
  .opt[aria-checked="true"] .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--on-bulb); }
  .toast { position: fixed; z-index: 30; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
    width: max-content; max-width: calc(100% - 32px); padding: 12px 16px; border-radius: var(--r-m); background: var(--bulb); color: var(--on-bulb); font-size: 14px; font-weight: 700;
    box-shadow: 0 0 24px var(--glow); transition: .24s; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .hl { animation: hl 1.6s ease; }
  @keyframes hl { 0%, 60% { box-shadow: 0 0 0 2px var(--bulb), 0 0 24px var(--glow); } 100% { box-shadow: none; } }
  body.lock { overflow: hidden; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="app">
  <svg class="lights" id="lights" viewBox="0 0 400 56" preserveAspectRatio="none" aria-hidden="true"></svg>

  <header>
    <div class="top">
      <p class="place">대구 서문시장 야시장</p>
      <div class="mode" role="group" aria-label="보는 시각">
        <button data-m="now" aria-pressed="true">오늘</button>
        <button data-m="demo" aria-pressed="false">영업일 시연</button>
      </div>
    </div>
    <h1 class="neon">오늘의 매대판</h1>
  </header>

  <section class="board" aria-label="야시장 운영 상태">
    <div class="board-head">
      <div class="when" id="when"></div>
      <span class="sign" id="sign"></span>
      <p class="say" id="say"></p>
    </div>
    <div>
      <div class="track"><i id="bar"></i></div>
      <div class="ticks mono" id="ticks"></div>
    </div>
    <div class="src">장사 시간 18:00–23:00 · 금 · 토 · 일 · 12월까지 · 상인회 공식 공지 연결 전</div>
  </section>

  <div class="chalk">
    <button class="chalk-row" id="cashless" aria-pressed="false">
      <span class="t"><b>현금 없이 왔어요</b><span class="d">카드 · 이체 · 페이 되는 매대만 볼게요</span></span>
      <span class="sw" aria-hidden="true"></span>
    </button>
  </div>

  <div class="chips" id="chips" role="group" aria-label="필터">
    <button data-f="all" aria-pressed="true">전체</button>
    <button data-f="open" aria-pressed="false">영업 중</button>
    <button data-f="card" aria-pressed="false">카드</button>
    <button data-f="transfer" aria-pressed="false">이체</button>
    <button data-f="pay" aria-pressed="false">페이</button>
    <button data-f="nosold" aria-pressed="false">품절 없음</button>
  </div>

  <section class="alley" aria-labelledby="alleyTitle">
    <div class="awning" aria-hidden="true"></div>
    <div class="alley-in">
      <div class="alley-head"><h2 id="alleyTitle">오늘의 포차</h2><span id="count"></span></div>
      <div class="stalls" id="list"></div>
    </div>
  </section>

  <div class="foot">
    <b>이 화면은 이렇게 만들어요</b>
    상인이 장사 전에 올린 사진과 한마디를 AI가 정리했어요. 품절은 상인이 직접 누른 것만 보여 드려요.<br>
    매대는 번호순이에요. 입력을 자주 해도 위로 올라가지 않아요.<br>
    이체는 되는지만 알려 드리고 계좌번호는 보여 주지 않아요.<br>
    예시 매대 12곳 · 수업 예시 가상 데이터
  </div>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* 줄조명: 두 번 처진 전선 위에 전구를 고르게 배치 */
(function lights() {
  const svg = document.getElementById("lights"), NS = "http://www.w3.org/2000/svg";
  const segs = [[[-10, 6], [100, 50], [200, 16]], [[200, 16], [300, 50], [410, 6]]];
  const q = (a, c, b, t) => [(1 - t) ** 2 * a[0] + 2 * (1 - t) * t * c[0] + t * t * b[0], (1 - t) ** 2 * a[1] + 2 * (1 - t) * t * c[1] + t * t * b[1]];
  const wire = document.createElementNS(NS, "path");
  wire.setAttribute("class", "wire"); wire.setAttribute("d", "M-10 6 Q100 50 200 16 Q300 50 410 6");
  svg.appendChild(wire);
  const colors = ["#FFD27A", "#FFD27A", "#FF8A4C", "#FFF2CC", "#FF5E7C", "#FFD27A", "#4FF0B6"];
  let k = 0;
  segs.forEach((s) => {
    for (let i = 1; i <= 7; i++) {
      const [x, y] = q(s[0], s[1], s[2], i / 8), c = colors[k % colors.length];
      const g = document.createElementNS(NS, "g");
      g.setAttribute("class", "bulb"); g.style.animationDelay = `${((k * 0.37) % 2.4).toFixed(2)}s`;
      g.innerHTML = `<ellipse cx="${x}" cy="${y + 8}" rx="8" ry="10" fill="${c}" opacity=".2"/><ellipse cx="${x}" cy="${y + 8}" rx="2.8" ry="4" fill="${c}"/><rect x="${x - 1.6}" y="${y + 1}" width="3.2" height="3.4" fill="#4A3A55"/>`;
      svg.appendChild(g); k++;
    }
  });
})();

/* 운영 일정 — 요일: 1110test 분석(금 · 토 · 일, 12월까지) · 시간: 1111test 밸류체인(18:00~23:00, 최신 파일) — decision_log D-01 */
const SCHED = { 5: [1080, 1380], 6: [1080, 1380], 0: [1080, 1380] };
const SEASON_END = new Date(2026, 11, 31, 23, 59);
const DAY = "일월화수목금토";
const hm = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const dur = (m) => (m >= 60 ? `${Math.floor(m / 60)}시간${m % 60 ? ` ${m % 60}분` : ""}` : `${m}분`);

function market(d) {
  const mins = d.getHours() * 60 + d.getMinutes(), sch = SCHED[d.getDay()];
  if (d > SEASON_END) return { kind: "season", mins };
  if (sch && mins >= sch[0] && mins < sch[1]) return { kind: "open", mins, sch };
  if (sch && mins < sch[0]) return { kind: "before", mins, sch };
  for (let i = 1; i <= 7; i++) {
    const n = new Date(d); n.setDate(d.getDate() + i);
    if (SCHED[n.getDay()] && n <= SEASON_END) return { kind: sch ? "after" : "off", mins, sch, next: n, nextSch: SCHED[n.getDay()], inDays: i };
  }
  return { kind: "season", mins };
}

/* 예시 매대 (가상) — 실제로는 상인 입력(D5) → AI 정리. at = 마지막 입력 시각(분) */
const STALLS = [
  { no: "01", name: "떡볶이", status: "open", pay: { cash: 1, card: 1, transfer: 1, pay: 0 }, soldout: [], at: 1210, menu: ["떡볶이", "어묵", "튀김 모둠"] },
  { no: "02", name: "납작만두", status: "open", pay: { cash: 1, card: 0, transfer: 1, pay: 0 }, soldout: [], at: 1195, menu: ["납작만두", "만두 + 떡볶이"] },
  { no: "03", name: "닭꼬치", status: "open", pay: { cash: 1, card: 0, transfer: 0, pay: 0 }, soldout: ["매운맛 꼬치"], at: 1218, menu: ["간장 꼬치", "매운맛 꼬치"] },
  { no: "04", name: "찹쌀도넛", status: "closed", pay: { cash: 1, card: 1, transfer: 0, pay: 1 }, soldout: [], at: 1020, note: "오늘 쉬어요", menu: ["찹쌀도넛", "꽈배기"] },
  { no: "05", name: "막창구이", status: "open", pay: { cash: 1, card: 1, transfer: 1, pay: 1 }, soldout: ["대창"], at: 1222, menu: ["막창", "대창", "주먹밥"] },
  { no: "06", name: "호떡", status: "unknown", pay: null, soldout: null, at: null, menu: ["씨앗호떡"] },
  { no: "07", name: "김밥", status: "open", pay: { cash: 1, card: 0, transfer: 0, pay: 1 }, soldout: [], at: 1180, menu: ["꼬마김밥", "유부초밥"] },
  { no: "08", name: "과일컵", status: "open", pay: { cash: 0, card: 1, transfer: 1, pay: 1 }, soldout: ["망고컵"], at: 1225, menu: ["딸기컵", "망고컵", "샤인머스캣컵"] },
  { no: "09", name: "수제어묵", status: "open", pay: { cash: 1, card: 1, transfer: 0, pay: 0 }, soldout: [], at: 1120, menu: ["수제어묵", "어묵탕"] },
  { no: "10", name: "삼겹꼬치", status: "open", pay: { cash: 0, card: 1, transfer: 0, pay: 1 }, soldout: [], at: 1212, menu: ["삼겹꼬치", "치즈 삼겹꼬치"] },
  { no: "11", name: "식혜 · 수정과", status: "open", pay: { cash: 1, card: 1, transfer: 1, pay: 1 }, soldout: [], at: 1200, menu: ["식혜", "수정과"] },
  { no: "12", name: "회오리감자", status: "early", pay: { cash: 1, card: 1, transfer: 0, pay: 0 }, soldout: ["회오리감자", "치즈감자"], at: 1215, note: "재료가 떨어져 일찍 닫았어요", menu: ["회오리감자", "치즈감자"] },
];
const PAY = [["cash", "현금"], ["card", "카드"], ["transfer", "이체"], ["pay", "페이"]];
const ST = { open: "영업 중", early: "일찍 닫음", closed: "오늘 휴무", unknown: "입력 전" };
const STALE = 90; // 분 — 오래된 정보 기준 (재료에 없음 · decision_log D-11)

const S = { mode: "now", cashless: false, f: "all" };
const $ = (s) => document.querySelector(s);
try { const m = localStorage.getItem("tb-mode2"); if (m === "now" || m === "demo") S.mode = m; } catch (e) {}

function demoNow() { const d = new Date(); d.setHours(20, 30, 0, 0); while (d.getDay() !== 5) d.setDate(d.getDate() + 1); return d; }
const nowDate = () => (S.mode === "demo" ? demoNow() : new Date());
const live = (mk) => mk.kind === "open";
const cashlessOk = (s) => s.pay && (s.pay.card || s.pay.transfer || s.pay.pay);

function visible(s, mk) {
  if (S.cashless && !cashlessOk(s)) return false;
  if (S.f === "open") return live(mk) && s.status === "open";
  if (S.f === "nosold") return live(mk) && s.status === "open" && s.soldout && !s.soldout.length;
  if (S.f !== "all") return !!(s.pay && s.pay[S.f]);
  return true;
}

let MK;
function renderBoard(d) {
  const mk = MK, sch = mk.sch || mk.nextSch || [1080, 1380];
  $("#when").textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${DAY[d.getDay()]}요일 · ${hm(mk.mins)}${S.mode === "demo" ? " (시연)" : ""}`;
  $("#ticks").innerHTML = `<span>${hm(sch[0])} 개장</span><span>${hm(sch[1])} 마감</span>`;
  const openN = STALLS.filter((s) => s.status === "open").length, okN = STALLS.filter((s) => s.status === "open" && cashlessOk(s)).length;
  let sign, cls = "", say, w = 0;
  if (mk.kind === "open") {
    sign = "영업중"; w = (mk.mins - sch[0]) / (sch[1] - sch[0]);
    say = S.cashless ? `현금 없이도 ${okN}곳에서 살 수 있어요` : `지금 ${openN}곳이 불을 켰어요\n마감까지 ${dur(sch[1] - mk.mins)}`;
  } else if (mk.kind === "before") {
    sign = "곧 열어요"; cls = "soon"; say = `오늘 ${hm(sch[0])}에 열어요\n${dur(sch[0] - mk.mins)} 남았어요`;
  } else if (mk.kind === "season") {
    sign = "운영 끝"; cls = "off"; say = "올해 야시장 운영이 끝났어요";
  } else {
    const nx = mk.next, when = mk.inDays === 1 ? "내일" : `${nx.getMonth() + 1}/${nx.getDate()}`;
    sign = mk.kind === "after" ? "영업 끝" : "쉬는 날"; cls = "off"; w = mk.kind === "after" ? 1 : 0;
    say = `${mk.kind === "after" ? "오늘 장사는 끝났어요" : `오늘(${DAY[d.getDay()]})은 야시장이 쉬어요`}\n다음 개장 ${when}(${DAY[nx.getDay()]}) ${hm(mk.nextSch[0])}`;
  }
  const el = $("#sign"); el.textContent = sign; el.className = `sign ${cls}`;
  $("#say").textContent = say; $("#bar").style.width = `${w * 100}%`;
}

function pays(s, big) {
  return PAY.map(([k, l]) => {
    const muted = !big && S.cashless && k === "cash" ? " muted" : "";
    if (!s.pay) return `<span class="pay unk${muted}">${l} ?</span>`;
    return s.pay[k] ? `<span class="pay yes${muted}">${l} ✓</span>` : `<span class="pay no${muted}">${l}</span>`;
  }).join("");
}
function line2(s, mk) {
  if (!live(mk)) return s.menu.slice(0, 3).join(" · ");
  if (s.status === "unknown") return "휴무인지 아직 몰라요";
  if (s.status !== "open") return s.note || "";
  const old = s.at != null && mk.mins - s.at > STALE ? `<span class="old">${dur(mk.mins - s.at)} 전 정보</span>` : "";
  return (s.soldout.length ? `<span class="so">${s.soldout.join(", ")} 품절</span>` : s.menu.join(" · ")) + old;
}
function stTag(s, mk) {
  if (!live(mk)) return `<span class="st off">${mk.kind === "before" ? "개장 전" : "쉬는 날"}</span>`;
  return `<span class="st ${s.status}">${ST[s.status]}</span>`;
}

function renderList(mk) {
  const shown = STALLS.filter((s) => visible(s, mk));
  $("#count").textContent = `${shown.length}곳 · 번호순`;
  $("#list").innerHTML = shown.length ? shown.map((s) => `
    <button class="stall ${live(mk) && s.status === "open" ? "" : "dark"}" id="r-${s.no}" data-no="${s.no}">
      <span class="lantern">${s.no}</span>
      <span class="name-line"><span class="name">${s.name}</span>${stTag(s, mk)}</span>
      <span class="line2">${line2(s, mk)}</span>
      <span class="pays">${pays(s)}</span>
    </button>`).join("") : '<div class="empty">조건에 맞는 매대가 없어요. 필터를 바꿔 보세요.</div>';
}

function render() { const d = nowDate(); MK = market(d); renderBoard(d); renderList(MK); }

/* 시트 */
const sheet = $("#sheet"), scrim = $("#scrim");
function openSheet(h) { sheet.innerHTML = '<div class="awning" aria-hidden="true"></div>' + h; sheet.scrollTop = 0; scrim.classList.add("show"); sheet.classList.add("show"); document.body.classList.add("lock"); }
function closeSheet() { scrim.classList.remove("show"); sheet.classList.remove("show"); document.body.classList.remove("lock"); }
scrim.addEventListener("click", closeSheet);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

function detail(no) {
  const s = STALLS.find((x) => x.no === no); if (!s) return;
  const mk = MK, on = live(mk), lit = on && s.status === "open", sold = new Set(on && s.soldout ? s.soldout : []);
  const menu = s.menu.map((m) => `<div><span class="${sold.has(m) ? "x" : ""}">${m}</span>${sold.has(m) ? '<span class="tag">품절</span>' : ""}</div>`).join("");
  let src;
  if (!on) src = `야시장이 ${mk.kind === "before" ? "아직 열기 전" : "쉬는 날"}이에요. 결제 수단과 메뉴는 <b>지난 영업일 입력</b> 기준이에요.`;
  else if (s.at == null) src = "오늘은 상인 입력이 아직 없어요. 결제 수단은 매대에서 직접 확인해 주세요.";
  else { const ago = mk.mins - s.at; src = `<b>AI 정리</b> · 상인 입력 <span class="mono">${hm(s.at)}</span> · ${dur(ago)} 전${ago > STALE ? " · 오래된 정보예요" : ""}${s.note ? ` · “${s.note}”` : ""}`; }
  openSheet(`
    <div class="s-head"><span class="lantern ${lit ? "" : "unlit"}">${s.no}</span><div><h3 id="sheetTitle">${s.name}</h3>${stTag(s, mk)}</div></div>
    <div class="s-label">결제 수단</div><div class="paybig">${pays(s, true)}</div>
    <div class="s-label">메뉴</div><div class="menu">${menu}</div>
    <div class="src-tag">${src}</div>
    <div class="btns"><button class="btn sub" data-act="report" data-no="${s.no}">정보가 달라요</button><button class="btn main" data-act="close">확인</button></div>`);
}

function reportSheet(no) {
  const opts = ["결제 수단이 달라요", "영업 여부가 달라요", "품절 정보가 달라요", "다른 문제가 있어요"];
  openSheet(`
    <p class="s-title" id="sheetTitle">어떤 정보가<br>실제와 달랐나요?</p>
    <p class="s-desc">${no}번 매대 · 확인하고 고칠게요</p>
    <div role="radiogroup">${opts.map((o, i) => `<button class="opt" id="opt-${i}" role="radio" aria-checked="false">${o}<span class="radio"></span></button>`).join("")}</div>
    <div class="btns"><button class="btn main" id="send" data-act="send" disabled>알리기</button></div>`);
}
sheet.addEventListener("click", (e) => {
  const o = e.target.closest(".opt");
  if (o) { sheet.querySelectorAll(".opt").forEach((x) => x.setAttribute("aria-checked", x === o)); $("#send").disabled = false; return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "close") closeSheet();
  if (b.dataset.act === "report") { closeSheet(); setTimeout(() => reportSheet(b.dataset.no), 240); }
  if (b.dataset.act === "send") { closeSheet(); toast("알려 주셔서 고마워요. 확인하고 고칠게요"); } // 처리자는 미정(decision_log D-04)
});
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2400); }

/* 이벤트 */
$("#list").addEventListener("click", (e) => { const r = e.target.closest(".stall"); if (r) detail(r.dataset.no); });
$("#cashless").addEventListener("click", (e) => { S.cashless = !S.cashless; e.currentTarget.setAttribute("aria-pressed", S.cashless); render(); });
$("#chips").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  S.f = b.dataset.f; $("#chips").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b)); render();
});
document.querySelector(".mode").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  S.mode = b.dataset.m; try { localStorage.setItem("tb-mode2", S.mode); } catch (err) {}
  syncMode(); render();
});
function syncMode() { document.querySelectorAll(".mode button").forEach((x) => x.setAttribute("aria-pressed", x.dataset.m === S.mode)); }
syncMode(); render();
setInterval(() => { if (S.mode === "now") render(); }, 60000);

/* 매대 앞 QR: 링크 끝 #stall-05 → 그 매대 상세 */
function fromHash() {
  const m = location.hash.match(/^#stall-(\d{1,2})$/); if (!m) return;
  const no = m[1].padStart(2, "0"), r = document.getElementById("r-" + no);
  if (r) { r.scrollIntoView({ block: "center" }); r.classList.add("hl"); setTimeout(() => detail(no), 320); }
}
fromHash(); window.addEventListener("hashchange", fromHash);
</script>
</body>
